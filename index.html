<style>
  :root {
    --bg: #0a1628;
    --sidebar-w: 270px;
    --sidebar: #0d1f3a;
    --accent: #e8a020;
    --text: #e8e8e8;
    --muted: #556;
    --hover: #112240;
    --active: #152a4a;
    --border: rgba(255,255,255,0.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: row;
    overflow: hidden;
    height: 100vh;
  }

  .sidebar {
    width: 0; min-width: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden; height: 100vh;
    transition: none;
    flex-shrink: 0;
  }
  .sidebar.open { position: fixed; top: 0; left: 0; width: var(--sidebar-w); min-width: var(--sidebar-w); z-index: 1000; transition: none; }

  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; min-width: var(--sidebar-w);
  }
  .sidebar-header img { width: 110px; opacity: 0.9; }
  .close-btn {
    background: none; border: none; color: var(--muted);
    font-size: 1.3rem; cursor: pointer; padding: 4px 8px;
    border-radius: 6px; transition: color 0.15s;
  }
  .close-btn:hover { color: var(--text); }

  .courses-list {
    flex-shrink: 0; min-width: var(--sidebar-w);
    overflow-y: auto; flex: 1;
    scrollbar-width: thin; scrollbar-color: #333 transparent;
  }
  .courses-list::-webkit-scrollbar { width: 4px; }
  .courses-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  /* CATEGORY */
  .category-header {
    padding: 10px 16px 6px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.43rem; letter-spacing: 3px;
    color: var(--accent);
    border-top: 1px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    min-width: var(--sidebar-w);
    user-select: none;
  }
  .category-header:first-child { border-top: none; }
  .category-arrow { font-size: 0.55rem; transition: transform 0.2s; }
  .category-header.open .category-arrow { transform: rotate(90deg); }

  .category-body { display: none; }
  .category-body.open { display: block; }

  .course-item {
    padding: 11px 16px; cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.05rem; letter-spacing: 2px; color: var(--muted);
    border-left: 3px solid transparent; transition: all 0.15s;
    display: flex; align-items: center; justify-content: space-between;
    white-space: nowrap;
  }
  .course-item:hover { background: var(--hover); color: var(--text); }
  .course-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--active); }
  .course-arrow { font-size: 0.55rem; transition: transform 0.2s; flex-shrink: 0; }
  .course-item.active .course-arrow { transform: rotate(90deg); }

  .course-submenu { display: none; background: rgba(0,0,0,0.2); border-left: 2px solid rgba(232,160,32,0.2); margin-left: 14px; }
  .course-submenu.open { display: block; }

  .module-item { border-bottom: 1px solid var(--border); }
  .module-header {
    padding: 8px 12px; cursor: pointer;
    font-size: 0.77rem; font-weight: 600; color: #778;
    display: flex; justify-content: space-between; align-items: center;
    transition: all 0.15s;
  }
  .module-header:hover { background: var(--hover); color: var(--text); }
  .module-header.open { color: var(--accent); }
  .module-arrow { font-size: 0.6rem; transition: transform 0.2s; flex-shrink: 0; margin-left: 6px; }
  .module-header.open .module-arrow { transform: rotate(90deg); }

  .videos-list { display: none; background: rgba(0,0,0,0.15); }
  .videos-list.open { display: block; }

  .video-item {
    padding: 7px 10px 7px 18px; cursor: pointer;
    font-size: 0.75rem; color: #667; transition: all 0.15s;
    border-left: 2px solid transparent; line-height: 1.35;
  }
  .video-item:hover { background: var(--hover); color: var(--text); }
  .video-item.playing { color: var(--accent); border-left-color: var(--accent); background: rgba(232,160,32,0.05); }

  .single-video-item {
    padding: 8px 10px 8px 14px; cursor: pointer;
    font-size: 0.8rem; color: #667; transition: all 0.15s;
    border-left: 2px solid transparent;
  }
  .single-video-item:hover { background: var(--hover); color: var(--text); }
  .single-video-item.playing { color: var(--accent); border-left-color: var(--accent); background: rgba(232,160,32,0.05); }

  .main {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; height: 100vh; min-width: 0;
    background: var(--bg); position: relative;
  }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center;
    padding: 8px 14px; gap: 12px; z-index: 10;
  }
  .hamburger {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border); color: var(--text);
    font-size: 1.2rem; cursor: pointer; padding: 5px 10px;
    border-radius: 8px; transition: background 0.15s; line-height: 1;
  }
  .hamburger:hover { background: rgba(255,255,255,0.14); }
  .topbar-info { display: flex; flex-direction: column; gap: 1px; }
  .topbar-course { font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
  .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 1.5px; color: var(--text); }

  .hero {
    width: 100%; height: 30vw; max-height: 220px; min-height: 160px;
    background: url('assets/backgrounds/fondo.jpg') center center / cover no-repeat;
    position: relative; flex-shrink: 0;
  }
  .hero::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 70%; background: linear-gradient(to bottom, transparent, var(--bg));
  }

  .video-wrapper { width: 100%; aspect-ratio: 16/9; position: relative; background: #000; flex-shrink: 0; }
  .video-wrapper video { width: 100%; height: 100%; display: block; background: #000; }

  .info-bar { flex-shrink: 0; padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .info-top { display: flex; flex-direction: column; gap: 2px; }
  .info-counter { font-size: 0.68rem; color: var(--muted); }
  #wakeMsg { color: #4caf50; font-size: 0.63rem; }

  .controls { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn {
    background: rgba(255,255,255,0.09); color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 11px 10px; border-radius: 50px;
    font-size: 0.9rem; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all 0.15s;
    font-weight: 600; flex: 1; text-align: center;
  }
  .btn:hover { background: rgba(255,255,255,0.17); border-color: var(--accent); }

  @media (max-width: 768px) {
    .hero { height: 52vw; min-height: 160px; max-height: 280px; }
    .video-wrapper { width: 100%; height: 56vw; margin-top: 0; }
    .info-bar { padding: 6px 10px 8px; }
    .sidebar.open {
      position: fixed; top: 0; left: 0;
      height: 100vh; z-index: 100;
      width: 75vw !important; min-width: 0 !important;
    }
    .main { width: 100% !important; flex: 1 !important; }
  }
#landing {
  position: relative;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
  overflow-y: auto;
  z-index: 999;
}
</style>
</head>

// Flatten all videos with category/course references
let allVideos = [];
categories.forEach((cat, cati) => {
  cat.courses.forEach((course, ci) => {
    course.modules.forEach((mod, mi) => {
      mod.videos.forEach((v, vi) => {
        allVideos.push({ ...v, cati, ci, mi, vi, courseName: course.name, catName: cat.name });
      });
    });
  });
});

function updateHero(cati){document.querySelector('.hero').style.backgroundImage="url('"+heroImgs[cati]+"')";} function toggleSidebar() {
  const landing = document.getElementById('landing');
  const isOnLanding = landing.style.display !== 'none';
  if (isOnLanding) {
    activeCourse = { cati: -1, ci: -1 };
    renderSidebar();

}

function getUrl(v) {   return v.type === 'video' ? v.url :           v.type === 'iframe' ? `https://drive.google.com/file/d/${v.url}/preview?autoplay=1` :          `${PROXY}?id=${v.url}`;
  
}

function handleTs(video,url){if(!window.MediaSource||!window.muxjs)return;var ms=new MediaSource();video.src=URL.createObjectURL(ms);ms.addEventListener('sourceopen',function(){var codec='video/mp4; codecs="avc1.42E01E,mp4a.40.2"';if(!MediaSource.isTypeSupported(codec))return;var sb=ms.addSourceBuffer(codec);var t=new muxjs.mp4.Transmuxer();var segments=[];var pending=false;function appendNext(){if(pending||segments.length===0)return;pending=true;var seg=segments.shift();sb.appendBuffer(seg);} sb.addEventListener('updateend',function(){pending=false;if(segments.length>0){appendNext();}else{try{ms.endOfStream();}catch(e){}}});t.on('data',function(seg){var data=new Uint8Array(seg.initSegment.byteLength+seg.data.byteLength);data.set(seg.initSegment,0);data.set(seg.data,seg.initSegment.byteLength);segments.push(data);appendNext();});fetch(url).then(function(r){return r.arrayBuffer();}).then(function(d){t.push(new Uint8Array(d));t.flush();}).catch(function(e){console.error('TS fetch error',e);});});}
    function globalIndex(cati, ci, mi, vi) {
  let idx = 0;
  for (let ca = 0; ca < cati; ca++) {
    categories[ca].courses.forEach(course => {
      course.modules.forEach(m => idx += m.videos.length);
    });
  }
  for (let c = 0; c < ci; c++) {
    categories[cati].courses[c].modules.forEach(m => idx += m.videos.length);
  }
  for (let m = 0; m < mi; m++) idx += categories[cati].courses[ci].modules[m].videos.length;
  return idx + vi;
}

function load(gIdx) {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('btn-back-home').style.display = 'block';
  current = (gIdx + allVideos.length) % allVideos.length;
  const v = allVideos[current];
  document.getElementById('topbar-course').textContent = v.courseName;
  document.getElementById('topbar-title').textContent = v.title;
  document.getElementById('info-counter').textContent = `${current + 1} / ${allVideos.length}`;

  if (v.cati !== activeCourse.cati || v.ci !== activeCourse.ci) {
    activeCourse = { cati: v.cati, ci: v.ci };
    openModules.clear();
  }
  openCategories.add(v.cati); updateHero(v.cati);
  const modKey = `${v.cati}-${v.ci}-${v.mi}`;
  openModules.add(modKey);

  renderSidebar();

  const isIframe = v.type === 'iframe';
  player.style.display = isIframe ? 'none' : 'block';
  document.getElementById('iframe-player').style.display = isIframe ? 'block' : 'none';
if (isIframe) {
    player.pause();
    if (window._iframeTimer) clearTimeout(window._iframeTimer);
    const iframeEl = document.getElementById('iframe-player');
    iframeEl.onload = null;
    iframeEl.src = '';
    fetch(`https://drive-proxy.jeremycalebp.workers.dev/meta?id=${v.url}`)
      .then(r => r.json())
      .then(data => {
        const ms = parseInt(data.videoMediaMetadata?.durationMillis || 0);
        iframeEl.src = getUrl(v);
        iframeEl.focus();
        window._iframeStart = Date.now();
        document.getElementById('seekbar-overlay').style.display = 'block';
        window._iframeDuration = ms;
        if (ms > 0) {
            window._iframeTimer = setTimeout(() => {
              window._iframeTimer = setTimeout(() => next(), ms + 2000);
            }, 3000);
          }
      }).catch(() => {
        iframeEl.src = getUrl(v);
        iframeEl.focus();
      });
  } else {
    document.getElementById('iframe-player').src = '';
        document.getElementById('seekbar-overlay').style.display = 'none';
    player.pause();
    player.src = '';
(async()=>{const proxyUrl=getUrl(v);if(v.type==="video"){player.src=proxyUrl;player.load();player.muted=false;player.play().catch(()=>{});return;}if(v.type==="drive"){const fileId=v.url;const metaUrl=`https://drive-proxy.jeremycalebp.workers.dev/meta?id=${fileId}`;try{const response=await fetch(metaUrl);const data=await response.json();if(data.mimeType&&data.mimeType.includes("mpeg")){handleTs(player,proxyUrl);}else{player.src=proxyUrl;player.load();}}catch(e){player.src=proxyUrl;player.load();}player.muted=false;player.play().catch(()=>{});}})();
  }
  setTimeout(() => {
    const el = document.querySelector(`[data-gidx="${current}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
  localStorage.setItem('lastVideo', current);
}

function next() { load(current + 1); }
function prev() { load(current - 1); }

function toggleCategory(cati) {
  if (openCategories.has(cati)) {
    openCategories.delete(cati);
  } else {
    openCategories.clear();
    openCategories.add(cati);
  }
  renderSidebar();
}

function toggleModule(key) {
  if (openModules.has(key)) {
    openModules.clear();
  } else {
    openModules.clear();
    openModules.add(key);
  }
  renderSidebar();
}

function switchCourse(cati, ci) {
  if (activeCourse.cati === cati && activeCourse.ci === ci) {
    activeCourse = { cati: -1, ci: -1 };
  } else {
    activeCourse = { cati, ci };
    openModules.clear();
  }
  renderSidebar();
}

function renderSidebar() {
  const cl = document.getElementById('courses-list');
  cl.innerHTML = categories.map((cat, cati) => {
    const catOpen = openCategories.has(cati);
    const coursesHTML = cat.courses.map((course, ci) => {
      const isActive = activeCourse.cati === cati && activeCourse.ci === ci;
      let submenuHTML = '';
      if (isActive) {
        if (course.flat) {
          submenuHTML = `<div class="course-submenu open">${
            course.modules[0].videos.map((v, vi) => {
              const gIdx = globalIndex(cati, ci, 0, vi);
              return `<div class="single-video-item${gIdx === current ? ' playing' : ''}" data-gidx="${gIdx}" onclick="load(${gIdx})">${v.title}</div>`;
            }).join('')
          }</div>`;
        } else {
          submenuHTML = `<div class="course-submenu open">${
            course.modules.map((mod, mi) => {
              const key = `${cati}-${ci}-${mi}`;
              const isOpen = openModules.has(key);
              const videos = mod.videos.map((v, vi) => {
                const gIdx = globalIndex(cati, ci, mi, vi);
                return `<div class="video-item${gIdx === current ? ' playing' : ''}" data-gidx="${gIdx}" onclick="load(${gIdx})">${v.title}</div>`;
              }).join('');
              return `<div class="module-item">
                <div class="module-header${isOpen ? ' open' : ''}" onclick="toggleModule('${key}')">
                  <span>${mod.label}</span><span class="module-arrow">▶</span>
                </div>
                <div class="videos-list${isOpen ? ' open' : ''}">${videos}</div>
              </div>`;
            }).join('')
          }</div>`;
        }
      }
      return `<div>
        <div class="course-item${isActive ? ' active' : ''}" onclick="switchCourse(${cati}, ${ci})">
          <span>${course.name}</span>
          <span class="course-arrow">▶</span>
        </div>
        ${submenuHTML}
      </div>`;
    }).join('');

    return `<div>
      <div class="category-header${catOpen ? ' open' : ''}" onclick="toggleCategory(${cati})">
        <span>${cat.name}</span>
        <span class="category-arrow">▶</span>
      </div>
      <div class="category-body${catOpen ? ' open' : ''}">${coursesHTML}</div>
    </div>`;
  }).join('');
}

player.addEventListener('ended', () => load(current + 1));
const seekOverlay = document.getElementById('seekbar-overlay');
seekOverlay.addEventListener('mousedown', (e) => {
  const rect = seekOverlay.getBoundingClientRect();
  const pct = ((e.clientX - rect.left) / rect.width) * 100;
  if (pct >= 90) {
    if (window._iframeTimer) clearTimeout(window._iframeTimer);
    window._iframeTimer = setTimeout(() => next(), 3000);
  }
  seekOverlay.style.pointerEvents = 'none';
  setTimeout(() => { seekOverlay.style.pointerEvents = 'auto'; }, 500);
});
window.addEventListener('message', (e) => {
  try {
    const data = JSON.parse(e.data);
    if (data.event === 'infoDelivery' && data.info && data.info.playerState === 0) {
      const v = allVideos[current];
      if (v && v.type === 'iframe') {
        if (window._iframeTimer) clearTimeout(window._iframeTimer);
        load(current + 1);
      }
    }
  } catch(err) {}
  if (e.origin && (e.origin.includes('drive.google.com') || e.origin.includes('docs.google.com'))) {
    const v = allVideos[current];
    if (v && v.type === 'iframe' && window._iframeStart) {
      const elapsed = (Date.now() - window._iframeStart) / 1000;
      const duration = (window._iframeDuration || 0) / 1000;
      if (duration > 0 && elapsed > duration * 0.9) {
        if (window._iframeTimer) clearTimeout(window._iframeTimer);
        load(current + 1);
      }
    }
  }
});

function toggleSearch() {
  const ov = document.getElementById('search-overlay');
  const isOpen = ov.style.display === 'flex';
  ov.style.display = isOpen ? 'none' : 'flex';
  if (!isOpen) {
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '';
    setTimeout(() => document.getElementById('search-input').focus(), 100);
  }
}
function closeSearch() {
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('search-input').value = '';
}
    document.addEventListener('click', function(e) {
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');
  if (!input.contains(e.target) && !results.contains(e.target)) {
    results.style.display = 'none';
  }
});
function searchVideos() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  const res = document.getElementById('search-results');
  if (!q) { res.innerHTML = ''; res.style.display = 'none'; return; }
  res.style.display = 'block';
  const matches = allVideos.filter(v => v.title.toLowerCase().includes(q) || v.courseName.toLowerCase().includes(q));
  if (!matches.length) { res.innerHTML = '<p style="padding:12px 16px; color:#667;">Sin resultados</p>'; res.style.display = 'block'; return; }
  res.innerHTML = matches.map(v => {
    const gIdx = allVideos.indexOf(v);
    return `<div onclick="load(${gIdx});closeSearch();" style="padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.07); cursor:pointer; border-radius:6px;">
      <div style="font-size:0.7rem; color:#e8a020; letter-spacing:2px;">${v.courseName}</div>
      <div style="font-size:0.95rem; color:#e8e8e8;">${v.title}</div>
    </div>`;
  }).join('');
}
    function pip() {
  if (document.pictureInPictureElement) document.exitPictureInPicture();
  else if (player.requestPictureInPicture) player.requestPictureInPicture();
}

async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
      document.getElementById('wakeMsg').textContent = '✓ Pantalla activa';
    }
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});

if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'INCUBADORA', artist: 'Curso de Importación',
    artwork: [{ src: '/curso-importacion/icon-192x192.png', sizes: '192x192', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', () => player.play());
  navigator.mediaSession.setActionHandler('pause', () => player.pause());
}
function enterCategory(cati) {
  document.getElementById('landing').style.display = 'none';
  openCategories.clear();
  openCategories.add(cati);
  activeCourse = { cati: -1, ci: -1 };
  renderSidebar();
  const firstVideo = allVideos.find(v => v.cati === cati);
  if (firstVideo) load(allVideos.indexOf(firstVideo));
}
const heroImgs = ['assets/backgrounds/fondo.jpg','assets/backgrounds/fondo-ia.jpg','assets/backgrounds/fondo-programacion.jpg','assets/backgrounds/fondo-diseno.jpg'];
keepAwake();
renderSidebar();
// sin autoload
</script>
