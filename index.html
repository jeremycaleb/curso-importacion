<style>
  :root {
    --bg: #0a1628;
    --sidebar-w: 270px;
    --sidebar: #0d1f3a;
    --accent: #e8a020;
    --text: #e8e8e8;
    --muted: #556;
    --hover: #112240;
    --active: #152a4a;
    --border: rgba(255,255,255,0.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: row;
    overflow: hidden;
    height: 100vh;
  }

  /* SIDEBAR */
  .sidebar {
    width: 0;
    min-width: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100vh;
    transition: width 0.28s ease, min-width 0.28s ease;
    flex-shrink: 0;
  }
  .sidebar.open {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
  }

  .sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    min-width: var(--sidebar-w);
  }
  .sidebar-header img { width: 110px; opacity: 0.9; }
  .close-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.15s;
  }
  .close-btn:hover { color: var(--text); }

  .sidebar-section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 3px;
    color: var(--muted);
    padding: 12px 16px 6px;
    flex-shrink: 0;
    min-width: var(--sidebar-w);
  }

  .courses-list {
    flex-shrink: 0;
    min-width: var(--sidebar-w);
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }
  .courses-list::-webkit-scrollbar { width: 4px; }
  .courses-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .course-item {
    padding: 11px 16px;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    color: var(--muted);
    border-left: 3px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    white-space: nowrap;
  }
  .course-item:hover { background: var(--hover); color: var(--text); }
  .course-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--active); }
  .course-arrow { font-size: 0.55rem; transition: transform 0.2s; flex-shrink: 0; }
  .course-item.active .course-arrow { transform: rotate(90deg); }

  .course-submenu {
    display: none;
    background: rgba(0,0,0,0.2);
    border-left: 2px solid rgba(232,160,32,0.2);
    margin-left: 14px;
  }
  .course-submenu.open { display: block; }

  .module-item { border-bottom: 1px solid var(--border); }
  .module-header {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.77rem;
    font-weight: 600;
    color: #778;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.15s;
  }
  .module-header:hover { background: var(--hover); color: var(--text); }
  .module-header.open { color: var(--accent); }
  .module-arrow { font-size: 0.6rem; transition: transform 0.2s; flex-shrink: 0; margin-left: 6px; }
  .module-header.open .module-arrow { transform: rotate(90deg); }

  .videos-list { display: none; background: rgba(0,0,0,0.15); }
  .videos-list.open { display: block; }

  .video-item {
    padding: 7px 10px 7px 18px;
    cursor: pointer;
    font-size: 0.75rem;
    color: #667;
    transition: all 0.15s;
    border-left: 2px solid transparent;
    line-height: 1.35;
  }
  .video-item:hover { background: var(--hover); color: var(--text); }
  .video-item.playing { color: var(--accent); border-left-color: var(--accent); background: rgba(232,160,32,0.05); }

  .single-video-item {
    padding: 8px 10px 8px 14px;
    cursor: pointer;
    font-size: 0.8rem;
    color: #667;
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }
  .single-video-item:hover { background: var(--hover); color: var(--text); }
  .single-video-item.playing { color: var(--accent); border-left-color: var(--accent); background: rgba(232,160,32,0.05); }

  /* MAIN — se encoge cuando sidebar abre */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100vh;
    min-width: 0;
    background: var(--bg);
    position: relative;
  }

  /* HAMBURGER TOPBAR — flotante sobre el hero */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    padding: 8px 14px;
    gap: 12px;
    z-index: 10;
  }
  .hamburger {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 5px 10px;
    border-radius: 8px;
    transition: background 0.15s;
    line-height: 1;
  }
  .hamburger:hover { background: rgba(255,255,255,0.14); }
  .topbar-info {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .topbar-course { font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
  .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 1.5px; color: var(--text); }

  /* HERO BANNER */
  .hero {
    width: 100%;
    height: 30vw;
    max-height: 220px;
    min-height: 100px;
    background: url('fondo.jpg') center center / cover no-repeat;
    position: relative;
    flex-shrink: 0;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 70%;
    background: linear-gradient(to bottom, transparent, var(--bg));
  }

  /* VIDEO */
  .video-wrapper {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    flex-shrink: 0;
  }
  .video-wrapper video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }

  /* INFO + CONTROLS */
.info-bar {
    flex-shrink: 0;
    padding: 10px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .info-top { display: flex; flex-direction: column; gap: 2px; }
  .info-counter { font-size: 0.68rem; color: var(--muted); }
  #wakeMsg { color: #4caf50; font-size: 0.63rem; }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
 .btn {
  background: rgba(255,255,255,0.09);

  border: 1px solid rgba(255,255,255,0.15);

  border-radius: 50px;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;

}

  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo-bottom img.logo { width: 110px; opacity: 0.9; }
  .logo-bottom img.profesor { width: 90px; opacity: 0.95; }

let allVideos = [];
courses.forEach((course, ci) => {
  course.modules.forEach((mod, mi) => {
    mod.videos.forEach((v, vi) => {
      allVideos.push({ ...v, ci, mi, vi, courseName: course.name });
    });
  });
});

let current = 0;
let activeCourse = 0;
let openModules = new Set();
const player = document.getElementById('player');

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function getUrl(v) {
  return v.type === 'video' ? v.url : `${PROXY}?id=${v.url}`;
}

function globalIndex(ci, mi, vi) {
  let idx = 0;
  for (let c = 0; c < ci; c++) courses[c].modules.forEach(m => idx += m.videos.length);
  for (let m = 0; m < mi; m++) idx += courses[ci].modules[m].videos.length;
  return idx + vi;
}

function load(gIdx) {
  current = (gIdx + allVideos.length) % allVideos.length;
  const v = allVideos[current];
  document.getElementById('topbar-course').textContent = v.courseName;
  document.getElementById('topbar-title').textContent = v.title;
  document.getElementById('info-counter').textContent = `${current + 1} / ${allVideos.length}`;

  if (v.ci !== activeCourse) {
    activeCourse = v.ci;
    openModules.clear();
  }
  const modKey = `${v.ci}-${v.mi}`;
  openModules.add(modKey);

  renderSidebar();

  player.pause();
  player.src = '';
  player.src = getUrl(v);
  player.load();
  player.play().catch(() => {
  player.muted = true;
  player.play().catch(() => {});
});

  setTimeout(() => {
    const el = document.querySelector(`[data-gidx="${current}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function next() { load(current + 1); }
function prev() { load(current - 1); }

function toggleModule(key) {
  if (openModules.has(key)) openModules.delete(key);
  else openModules.add(key);
  renderSidebar();
}

function switchCourse(ci) {
  if (activeCourse === ci) {
    activeCourse = -1;
  } else {
    activeCourse = ci;
    openModules.clear();
  }
  renderSidebar();
}

function renderSidebar() {
  const cl = document.getElementById('courses-list');
  cl.innerHTML = courses.map((c, ci) => {
    const isActive = ci === activeCourse;
    let submenuHTML = '';

    if (isActive) {
      const course = courses[ci];
      if (course.flat) {
        submenuHTML = `<div class="course-submenu open">${
          course.modules[0].videos.map((v, vi) => {
            const gIdx = globalIndex(ci, 0, vi);
            return `<div class="single-video-item${gIdx === current ? ' playing' : ''}" data-gidx="${gIdx}" onclick="load(${gIdx})">${v.title}</div>`;
          }).join('')
        }</div>`;
      } else {
        submenuHTML = `<div class="course-submenu open">${
          course.modules.map((mod, mi) => {
            const key = `${ci}-${mi}`;
            const isOpen = openModules.has(key);
            const videos = mod.videos.map((v, vi) => {
              const gIdx = globalIndex(ci, mi, vi);
              return `<div class="video-item${gIdx === current ? ' playing' : ''}" data-gidx="${gIdx}" onclick="load(${gIdx})">${v.title}</div>`;
            }).join('');
            return `<div class="module-item">
              <div class="module-header${isOpen ? ' open' : ''}" onclick="toggleModule('${key}')">
                <span>${mod.label}</span><span class="module-arrow">▶</span>
              </div>
              <div class="videos-list${isOpen ? ' open' : ''}">${videos}</div>
            </div>`;
          }).join('')
        }</div>`;
      }
    }

    return `<div>
      <div class="course-item${isActive ? ' active' : ''}" onclick="switchCourse(${ci})">
        <span>${c.name}</span>
        <span class="course-arrow">▶</span>
      </div>
      ${submenuHTML}
    </div>`;
  }).join('');
}

player.addEventListener('ended', () => load(current + 1));

function pip() {
  if (document.pictureInPictureElement) document.exitPictureInPicture();
  else if (player.requestPictureInPicture) player.requestPictureInPicture();
}

async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
      document.getElementById('wakeMsg').textContent = '✓ Pantalla activa';
    }
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});

if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'INCUBADORA', artist: 'Curso de Importación',
    artwork: [{ src: '/curso-importacion/icon-192x192.png', sizes: '192x192', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', () => player.play());
  navigator.mediaSession.setActionHandler('pause', () => player.pause());
}

keepAwake();
renderSidebar();
load(0);
