<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: sans-serif;
    min-height: 100vh;
    background: #0a1628;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero {
    width: 100%;
    height: 45vw;
    max-height: 360px;
    background: url('fondo.jpg') center center / cover no-repeat;
    position: relative;
    flex-shrink: 0;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60%;
    background: linear-gradient(to bottom, transparent, #0a1628);
  }
  .content {
    width: 100%;
    background: linear-gradient(to bottom, #0a1628, #05090f);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 20px 30px;
  }
  #chapter-title { color: #ccc; font-size: 0.95rem; margin-bottom: 8px; }
  #player-container { width: 100%; max-width: 700px; margin-bottom: 16px; }
  video { width: 100%; border-radius: 10px; background: #000; display: block; }
  iframe#drivePlayer {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 10px;
    border: none;
    display: none;
  }
  #controls { display: flex; gap: 10px; margin-bottom: 10px; }
  button { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 11px 26px; border-radius: 50px; font-size: 0.95rem; cursor: pointer; font-weight: bold; }
  button:hover { background: rgba(255,255,255,0.2); }
  #pipBtn { font-size: 0.82rem; margin-bottom: 14px; }
  .bottom-row {
    width: 100%;
    max-width: 700px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .logo { width: 151px; opacity: 0.95; }
  .profesor { width: 125px; opacity: 0.95; margin-right: 20px; margin-bottom: 30px; }
  #counter { color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-bottom: 6px; }
  #wakeMsg { color: #4caf50; font-size: 0.72rem; }
  #driveNote { color: rgba(255,255,255,0.35); font-size: 0.72rem; margin-top: 6px; display: none; }
</style>

let current = 0;
let driveTimer = null;
const player = document.getElementById('player');
const drivePlayer = document.getElementById('drivePlayer');
const driveNote = document.getElementById('driveNote');

function load(i) {
  current = (i + videos.length) % videos.length;
  const v = videos[current];
  document.getElementById('chapter-title').textContent = v.title;
  document.getElementById('counter').textContent = `${current + 1} / ${videos.length}`;

  if (driveTimer) { clearTimeout(driveTimer); driveTimer = null; }

  if (v.type === 'video') {
    drivePlayer.src = '';
    player.style.display = 'block';
    drivePlayer.style.display = 'none';
    driveNote.style.display = 'none';
    player.src = v.url;
    player.play();
  } else {
    player.pause();
    player.src = '';
    player.style.display = 'none';
    drivePlayer.style.display = 'block';
    driveNote.style.display = 'block';
    drivePlayer.src = `https://drive.google.com/file/d/${v.url}/preview?autoplay=1`;
  }
}

function startDriveAutoNext() {
  // Intentamos detectar fin via postMessage de Drive (no siempre funciona)
  // Como fallback: mostramos botón Siguiente prominente
  // No hay forma confiable de detectar fin en iframe cross-origin
}

player.addEventListener('ended', () => load(current + 1));

function next() { load(current + 1); }
function prev() { load(current - 1); }

function pip() {
  if (videos[current].type === 'drive') {
    alert('PiP no disponible para videos de Google Drive');
    return;
  }
  if (document.pictureInPictureElement) {
    document.exitPictureInPicture();
  } else if (player.requestPictureInPicture) {
    player.requestPictureInPicture();
  }
}

let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakeMsg').textContent = '✓ Pantalla activa';
    }
  } catch(e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});

if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'INCUBADORA',
    artist: 'Curso de Importación',
    artwork: [{ src: '/curso-importacion/icon-192x192.png', sizes: '192x192', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', () => player.play());
  navigator.mediaSession.setActionHandler('pause', () => player.pause());
  try {
    navigator.mediaSession.setActionHandler('enterpictureinpicture', async () => {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      await player.requestPictureInPicture();
    });
  } catch(e) {}
}

keepAwake();
load(0);
