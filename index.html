<style>
  :root {
    --bg: #080e1a;
    --bg2: #0d1525;
    --accent: #e8a020;
    --accent2: #f0c060;
    --text: #e8e8e8;
    --muted: #6b7a99;
    --card: #111827;
    --card-hover: #1a2540;
    --border: rgba(255,255,255,0.07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HERO */
  .hero {
    width: 100%;
    height: 42vw;
    max-height: 340px;
    background: url('fondo.jpg') center center / cover no-repeat;
    position: relative;
    flex-shrink: 0;
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(8,14,26,0.3) 0%, var(--bg) 100%);
  }

  /* PLAYER SECTION */
  .player-section {
    width: 100%;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px 0;
  }
  #chapter-title {
    color: var(--accent2);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.25rem;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-align: center;
    max-width: 700px;
    width: 100%;
  }
  #course-badge {
    display: inline-block;
    background: var(--accent);
    color: #000;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 3px;
    margin-bottom: 10px;
  }
  #player-container { width: 100%; max-width: 700px; margin-bottom: 12px; }
  video {
    width: 100%;
    border-radius: 8px;
    background: #000;
    display: block;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  #controls { display: flex; gap: 10px; margin-bottom: 10px; }
  button {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.16); border-color: var(--accent); }
  #pipBtn { font-size: 0.8rem; margin-bottom: 12px; }
  .bottom-row {
    width: 100%;
    max-width: 700px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .logo { width: 140px; opacity: 0.9; }
  .profesor { width: 115px; opacity: 0.9; margin-right: 16px; }
  #counter { color: var(--muted); font-size: 0.75rem; margin-bottom: 4px; }
  #wakeMsg { color: #4caf50; font-size: 0.7rem; margin-bottom: 16px; }

  /* NETFLIX MENU */
  .netflix-menu {
    width: 100%;
    background: var(--bg);
    padding: 8px 0 40px;
  }

  /* TABS */
  .course-tabs {
    display: flex;
    gap: 0;
    padding: 0 16px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .course-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.05rem;
    letter-spacing: 2px;
    padding: 10px 20px 8px;
    cursor: pointer;
    white-space: nowrap;
    border-radius: 0;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--text); background: none; border-color: rgba(255,255,255,0.2); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* MODULE ROWS */
  .module-row {
    margin-bottom: 24px;
    display: none;
  }
  .module-row.visible { display: block; }
  .module-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 2px;
    color: var(--muted);
    padding: 0 16px;
    margin-bottom: 8px;
  }
  .module-label span {
    color: var(--accent);
    margin-right: 6px;
  }

  /* SCROLLABLE VIDEO CARDS */
  .cards-scroll {
    display: flex;
    gap: 8px;
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
    padding-bottom: 6px;
  }
  .cards-scroll::-webkit-scrollbar { height: 3px; }
  .cards-scroll::-webkit-scrollbar-track { background: transparent; }
  .cards-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

  .video-card {
    flex-shrink: 0;
    width: 140px;
    background: var(--card);
    border-radius: 6px;
    border: 1px solid var(--border);
    padding: 10px 10px 8px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .video-card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .video-card.playing {
    border-color: var(--accent);
    background: var(--card-hover);
  }
  .video-card.playing::before {
    content: '▶';
    position: absolute;
    top: 6px;
    right: 8px;
    color: var(--accent);
    font-size: 0.6rem;
  }
  .card-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: rgba(255,255,255,0.08);
    line-height: 1;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 0.72rem;
    color: var(--text);
    line-height: 1.3;
    font-weight: 500;
  }
  .video-card.playing .card-title { color: var(--accent2); }
</style>

// Flatten all videos with course/module info for player
let allVideos = [];
courses.forEach((course, ci) => {
  course.modules.forEach((mod, mi) => {
    mod.videos.forEach((v, vi) => {
      allVideos.push({ ...v, courseIdx: ci, modIdx: mi, vidIdx: vi, courseName: course.name });
    });
  });
});

let current = 0;
let activeCourse = 0;
const player = document.getElementById('player');

function getUrl(v) {
  return v.type === 'video' ? v.url : `${PROXY}?id=${v.url}`;
}

function load(globalIdx) {
  current = (globalIdx + allVideos.length) % allVideos.length;
  const v = allVideos[current];
  document.getElementById('chapter-title').textContent = v.title;
  document.getElementById('course-badge').textContent = v.courseName;
  document.getElementById('counter').textContent = `${current + 1} / ${allVideos.length}`;

  // Update playing card
  document.querySelectorAll('.video-card').forEach(c => c.classList.remove('playing'));
  const card = document.querySelector(`[data-global="${current}"]`);
  if (card) {
    card.classList.add('playing');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  player.pause();
  player.src = '';
  player.src = getUrl(v);
  player.load();
  player.play().catch(() => {});
}

function next() { load(current + 1); }
function prev() { load(current - 1); }

function switchCourse(idx) {
  activeCourse = idx;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  renderMenu();
}

function renderMenu() {
  const container = document.getElementById('menu-content');
  const course = courses[activeCourse];
  let globalOffset = 0;
  // Calculate offset for this course
  for (let ci = 0; ci < activeCourse; ci++) {
    courses[ci].modules.forEach(m => globalOffset += m.videos.length);
  }

  let html = '';
  let modOffset = 0;
  course.modules.forEach((mod, mi) => {
    html += `<div class="module-row visible">
      <div class="module-label"><span>▶</span>${mod.label}</div>
      <div class="cards-scroll">`;
    mod.videos.forEach((v, vi) => {
      const gIdx = globalOffset + modOffset + vi;
      const isPlaying = gIdx === current;
      html += `<div class="video-card${isPlaying ? ' playing' : ''}" data-global="${gIdx}" onclick="load(${gIdx})">
        <div class="card-num">${String(vi + 1).padStart(2, '0')}</div>
        <div class="card-title">${v.title}</div>
      </div>`;
    });
    html += `</div></div>`;
    modOffset += mod.videos.length;
  });
  container.innerHTML = html;
}

player.addEventListener('ended', () => load(current + 1));

function pip() {
  if (document.pictureInPictureElement) {
    document.exitPictureInPicture();
  } else if (player.requestPictureInPicture) {
    player.requestPictureInPicture();
  }
}

let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wakeMsg').textContent = '✓ Pantalla activa';
    }
  } catch(e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});

if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({
    title: 'INCUBADORA',
    artist: 'Curso de Importación',
    artwork: [{ src: '/curso-importacion/icon-192x192.png', sizes: '192x192', type: 'image/png' }]
  });
  navigator.mediaSession.setActionHandler('play', () => player.play());
  navigator.mediaSession.setActionHandler('pause', () => player.pause());
  try {
    navigator.mediaSession.setActionHandler('enterpictureinpicture', async () => {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      await player.requestPictureInPicture();
    });
  } catch(e) {}
}

keepAwake();
renderMenu();
load(0);
</script>
